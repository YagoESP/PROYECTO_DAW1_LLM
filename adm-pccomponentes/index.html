<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Componentes - Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="app-container">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <div class="sidebar-header">
                <h2>Admin<span class="highlight">PC</span></h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#/dashboard" class="nav-item" data-i18n="nav_dashboard">Dashboard</a>
                <a href="#/categories" class="nav-item" data-i18n="nav_categories">Categories</a>
                <a href="#/products" class="nav-item" data-i18n="nav_products">Products</a>
                <a href="#/customers" class="nav-item" data-i18n="nav_customers">Customers</a>
                <a href="#/carts" class="nav-item" data-i18n="nav_carts">Carts</a>
            </nav>
            <div class="sidebar-footer">
                <select id="lang-selector">
                    <option value="es">Español</option>
                    <option value="en">English</option>
                </select>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar glass-panel">
                <h1 id="page-title" data-i18n="dashboard_title">Dashboard</h1>
            </header>
            
            <div id="router-view" class="content-area">
                <!-- Content injected by JavaScript router -->
            </div>
        </main>
    </div>

    <!-- Modals Container -->
    <div id="modal-container" class="modal-overlay hidden"></div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
